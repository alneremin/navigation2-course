bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /f1/odom
    transform_tolerance: 0.1
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    default_nav_to_pose_bt_xml: $(find-pkg-share f1_navigation)/config/nav2_bt_navigator/navigate_to_pose_w_recovery.xml

lifecycle_manager_navigation:
    ros__parameters:
        use_sim_time: True
        autostart: true
        node_names: ['bt_navigator', 'planner_server', 'controller_server', 'behavior_server']
        bond_timeout: 4.0
        attempt_respawn_reconnection: true
        bond_respawn_max_duration: 10.0

planner_server:
    ros__parameters:
        use_sim_time: True
        expected_planner_frequency: 20.0
        planner_plugins: ["GridBased"]
        GridBased:
          plugin: nav2_navfn_planner::NavfnPlanner
          tolerance: 0.5
          use_astar: false
          allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.01
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        combination_method: 1
        scan:
          topic: /f1/scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: LaserScan
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 2.0
        inflate_unknown: false
        inflate_around_unknown: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      always_send_full_costmap: true

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /f1/odom

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    controller_plugins: ["MPPI", "MPPI_SLOW"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
      stateful: True

    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      visualize: true
      vx_max: 0.3
      vx_min: -0.3
      vy_max: 0.3
      wz_max: 1.0
      ax_max: 3.0
      ax_min: -3.0
      az_max: 3.2
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.3
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.72
      temperature: 0.3
      gamma: 0.015
      critics: ["ConstraintCritic",
                "GoalCritic",
                "GoalAngleCritic",
                "PathAlignCritic",
                "PathFollowCritic",
                "PathAngleCritic"]
      ConstraintCritic.cost_weight: 4.0
      GoalCritic.cost_weight: 5.0
      GoalAngleCritic.cost_weight: 3.0
      PathAlignCritic.cost_weight: 14.0
      PathFollowCritic.cost_weight: 5.0
      PathAngleCritic.cost_weight: 2.0

    MPPI_SLOW:
      plugin: "nav2_mppi_controller::MPPIController"
      visualize: false
      vx_max: 0.15          
      vx_min: -0.15
      vy_max: 0.0
      wz_max: 0.7
      ax_max: 2.0
      ax_min: -2.0
      az_max: 2.0
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.05
      vy_std: 0.0
      wz_std: 0.2
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.9   
      temperature: 0.5
      gamma: 0.02
      critics: ["ConstraintCritic",
                "GoalCritic",
                "PathAlignCritic",
                "PathFollowCritic"]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      robot_radius: 0.25
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        combination_method: 1
        scan:
          topic: /f1/scan
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 2.0
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: true

behavior_server:
    ros__parameters:
      enable_stamped_cmd_vel: true
      use_sim_time: True
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      wait:
        plugin: nav2_behaviors::Wait
      drive_on_heading:
        plugin: nav2_behaviors::DriveOnHeading
      local_frame: odom
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2